<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Видеонаблюдение</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <div class="header-logo">
    <div class="icon">🎥</div>
    <span>SURVEILLANCE</span>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" onclick="openGenerateLink()">+ Ссылка на камеру</button>
  </div>
</header>

<div class="main-container">
  <aside class="sidebar">
    <div class="sidebar-header"><span class="sidebar-title">Камеры</span></div>
    <div class="camera-list" id="cameraList"></div>
  </aside>

  <div class="content">
    <div class="view-grid grid-4" id="viewGrid">
      <div class="empty-state">
        <div class="empty-icon">📹</div>
        <h3>Нет активных камер</h3>
        <button class="btn btn-primary" onclick="openGenerateLink()">Подключить камеру</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="linkModal">
  <div class="modal">
    <div class="modal-title">
      <span>🔗 Ссылка на камеру</span>
      <button class="btn btn-icon" onclick="closeLinkModal()">✕</button>
    </div>
    <div id="linkStep1">
      <div class="form-group">
        <label class="form-label">Название</label>
        <input class="form-input" id="linkName" type="text" value="Камера">
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="generateLink()">Сгенерировать</button>
      </div>
    </div>
    <div id="linkStep2" style="display:none;">
      <div class="form-group">
        <input class="form-input" id="linkResult" type="text" readonly>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="copyLink()">📋 Копировать</button>
      </div>
    </div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
